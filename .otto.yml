otto:
  api: 1
  tasks: [ci]
  envs:
    VERSION: "$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"

tasks:
  lint:
    help: "Run whitespace and convention linting"
    bash: |
      # rust-ci.yml@v1 installs otto but not whitespace (exit 127 on the runner)
      if ! command -v whitespace >/dev/null; then
        echo "=== whitespace not on PATH; installing scottidler/whitespace v0.1.2 ==="
        cargo install --locked --git https://github.com/scottidler/whitespace --tag v0.1.2
      fi
      whitespace -r
      echo ""
      echo "=== Deny _variable binding pattern ==="
      if grep -rn --include='*.rs' -P '(\blet\s+(mut\s+)?|[(,]\s*|\|\s*|\bfor\s+)_[a-zA-Z]' core/src server/src; then
        echo ""
        echo "ERROR: found _variable binding pattern."
        echo "Use _ to discard or use the variable, never _varname."
        exit 1
      fi
      echo "=== No _variable patterns found ==="

  bloat:
    help: "Fail if any source file exceeds BLOAT_MAX_LINES (default 1500)"
    bash: |
      LIMIT="${BLOAT_MAX_LINES:-1500}"
      FAILED=0
      echo "=== Checking file line counts (limit: $LIMIT) ==="
      while IFS= read -r file; do
        lines=$(wc -l < "$file")
        if [ "$lines" -gt "$LIMIT" ]; then
          echo "  FAIL: $file ($lines lines, +$((lines - LIMIT)) over limit)"
          FAILED=1
        fi
      done < <(find . -type f \( -name "*.rs" -o -name "*.py" -o -name "*.js" -o -name "*.ts" \) \
        -not -path "*/target/*" \
        -not -path "*/node_modules/*" \
        -not -path "*/.git/*")
      if [ "$FAILED" -eq 1 ]; then
        echo "Decompose these files into modules before proceeding."
        exit 1
      fi
      echo "All files within $LIMIT line limit"

  check:
    help: "Run all quality checks (compile, clippy, format)"
    bash: |
      echo "=== Checking compilation ==="
      cargo check --workspace --all-targets --all-features
      echo ""
      echo "=== Running Clippy ==="
      cargo clippy --workspace --all-targets --all-features -- -D warnings
      echo ""
      echo "=== Checking format ==="
      cargo fmt --all --check
      echo ""
      echo "=== All checks passed! ==="

  test:
    help: "Run all tests"
    bash: |
      cargo test --workspace --all-features

  core-guard:
    help: "Fail if riki-core acquires an axum dependency (core must stay framework-agnostic; HTTP handlers belong in the server)"
    bash: |
      # `cargo tree -i` inverts the graph: it lists what depends on axum within the -p package.
      # No package printed = core does not pull axum in, by any path, dev-dependencies included.
      if cargo tree -p riki-core -i axum >/dev/null 2>&1; then
        echo "ERROR: riki-core now depends on axum." >&2
        cargo tree -p riki-core -i axum >&2
        exit 1
      fi
      echo "=== riki-core is still axum-free (OK) ==="

  editor:
    help: "Typecheck, test, and rebuild the editor bundle and page theme; fail if the committed server/assets/ files are stale"
    bash: |
      if ! command -v node >/dev/null 2>&1; then
        echo "ERROR: node is not installed. The editor task needs node to rebuild" >&2
        echo "server/assets/editor.js from editor/ (see editor/package.json)." >&2
        exit 1
      fi
      cd editor
      # engines.node is a hard floor here (pnpm only warns): below it vitest's jsdom dies on a
      # missing undici API, so say which node is too old instead.
      node -e '
        const want = require("./package.json").engines?.node ?? "";
        const floor = /^>=(\d+)\.(\d+)\.(\d+)$/.exec(want);
        if (!floor) { console.error(`ERROR: editor/package.json engines.node must be ">=X.Y.Z", got "${want}"`); process.exit(1); }
        const have = process.versions.node.split(".").map(Number);
        const need = floor.slice(1).map(Number);
        const cmp = have[0] - need[0] || have[1] - need[1] || have[2] - need[2];
        if (cmp < 0) { console.error(`ERROR: node ${process.versions.node} is older than editor/package.json engines.node "${want}".`); process.exit(1); }
      '
      # pnpm on PATH, else corepack running the exact pnpm editor/package.json pins in
      # "packageManager" (a CI runner with node but no pnpm). Neither: fail, naming both.
      PINNED="$(node -p 'require("./package.json").packageManager ?? ""')"
      case "$PINNED" in
        pnpm@*) ;;
        *) echo "ERROR: editor/package.json \"packageManager\" must pin pnpm@<version>, got '$PINNED'" >&2; exit 1 ;;
      esac
      if command -v pnpm >/dev/null 2>&1; then
        PNPM=(pnpm)
      elif command -v corepack >/dev/null 2>&1; then
        echo "=== pnpm not on PATH; using corepack $PINNED ==="
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        PNPM=(corepack "$PINNED")
      else
        echo "ERROR: neither pnpm nor corepack is installed; the editor task needs $PINNED." >&2
        exit 1
      fi
      "${PNPM[@]}" install --frozen-lockfile --prefer-offline
      "${PNPM[@]}" run typecheck
      "${PNPM[@]}" run test
      "${PNPM[@]}" run build
      cd ..
      if ! git diff --exit-code -- server/assets/editor.js server/assets/editor.css server/assets/riki.js server/assets/riki.css; then
        echo "" >&2
        echo "ERROR: server/assets/ differs from a fresh build of editor/. Commit the rebuilt bundle." >&2
        exit 1
      fi
      echo "=== Editor bundle matches a fresh build ==="

  e2e:
    help: "Playwright against the real riki binary (needs chromium: cd editor && pnpm exec playwright install chromium)"
    bash: |
      cargo build -p riki-server
      cd editor
      pnpm run e2e

  # Mutation testing: no args = whole workspace; --diff = scoped to a diff (NOT part of ci)
  mutants:
    help: "Mutation-test the workspace; --diff FILE scopes to a diff (CI use; NOT part of ci)"
    params:
      --diff:
        default: ""
        help: "Unified diff FILE: test only mutants in the changed lines"
      --shard:
        default: ""
        help: "Run shard k/N of the mutant set (round-robin); e.g. 0/4"
      --jobs:
        default: ""
        help: "Parallel mutant jobs (default 8; rejected with --in-place)"
      --in-place:
        default: false
        help: "Mutate this checkout instead of copying it per job (single job; CI uses this)"
    bash: |
      # Pinned so a toolchain refresh cannot change what "zero survivors" means. The reusable
      # mutants.yml exports MUTANTS_VERSION and installs the prebuilt binary first.
      # A stale `rc` from a prior run must not outlive a refused or failed run below.
      rm -f rc
      MUTANTS_VERSION="${MUTANTS_VERSION:-27.1.0}"
      have=$(cargo mutants --version 2>/dev/null | awk '{print $2}')
      if [ "$have" != "$MUTANTS_VERSION" ]; then
        echo "installing cargo-mutants $MUTANTS_VERSION (found: ${have:-none})"
        cargo install cargo-mutants --version "$MUTANTS_VERSION" --locked
      fi

      # Every job gets its own workspace copy and target/. A RAM-backed /tmp fills and dies with
      # "No space left on device" after reporting zero survivors so far: a false green. Use a
      # disk-backed dir, and not one under a .git ancestor (tests that assert "not a repo" break).
      export TMPDIR="${TMPDIR_MUTANTS:-/var/tmp/riki-mutants}"
      mkdir -p "$TMPDIR"

      # --in-place is single-job; cargo-mutants rejects the pair, a clear message beats its usage dump.
      if [ "${in_place}" = "true" ] && [ -n "${jobs}" ]; then
        echo "mutants: --in-place and --jobs cannot be used together (--in-place runs one job)" >&2
        exit 2
      fi
      if [ "${in_place}" = "true" ]; then
        MUTANT_JOBS=1
        JOBS_ARGS=(--in-place)
      else
        MUTANT_JOBS="${jobs:-8}"
        JOBS_ARGS=(--jobs "$MUTANT_JOBS")
      fi
      # --jobs bounds concurrent mutants, not the threads each test binary spawns. A rayon pool
      # defaults to nproc per process, so cap it at cores/jobs or the timeout below is meaningless.
      CORES=$(nproc)
      export RAYON_NUM_THREADS=$(( CORES / MUTANT_JOBS > 0 ? CORES / MUTANT_JOBS : 1 ))
      echo "mutants: --jobs $MUTANT_JOBS x RAYON_NUM_THREADS=$RAYON_NUM_THREADS on $CORES cores"

      # --diff FILE is the scope; no --diff = the whole workspace.
      # A diff with no '+++ b/' header is refused: cargo-mutants matches paths by the a/ b/
      # prefixes, so a diff.mnemonicPrefix diff (i/ w/) lists 0 mutants and exits 0, a false green.
      SCOPE_ARGS=()
      if [ -n "${diff}" ]; then
        if [ -s "${diff}" ] && ! grep -q '^+++ b/' "${diff}"; then
          echo "mutants: ${diff} has no '+++ b/' header; regenerate it with 'git -c diff.mnemonicPrefix=false diff' (other prefixes match nothing and test nothing)" >&2
          exit 2
        fi
        SCOPE_ARGS=(--in-diff "${diff}")
      fi

      # round-robin: the default `slice` gives ceil(total/N) chunks, so a shard can be empty.
      SHARD_ARGS=()
      if [ -n "${shard}" ]; then
        SHARD_ARGS=(--shard "${shard}" --sharding round-robin)
      fi

      # --workspace is required: with default-members set, cargo-mutants scopes to those alone and
      # can test nothing while exiting 0. --timeout is explicit because the baseline-derived one
      # is measured idle, then mutants run parallel. Feature flags match `otto test`.
      # cargo-mutants' raw exit code goes to `rc` before this task exits non-zero: otto collapses
      # failures to 1, and the CI report job must tell 2 (missed), 3 (timeout), 4 (baseline failed),
      # 5/6 (diff mismatch/invalid) apart.
      rc=0
      cargo mutants --workspace --all-features --timeout 300 --annotations auto \
        "${SCOPE_ARGS[@]}" "${SHARD_ARGS[@]}" "${JOBS_ARGS[@]}" || rc=$?
      echo "$rc" > rc
      echo "mutants: cargo-mutants exit code $rc written to $(pwd)/rc"
      exit "$rc"

  ci:
    help: "Full CI pipeline (lint + bloat + check + test + core-guard + editor in parallel)"
    before: [lint, bloat, check, test, core-guard, editor]
    bash: |
      echo "=== All CI checks passed! ==="

  build:
    help: "Build release binary"
    bash: |
      cargo build --release
      echo "=== Release build complete ==="

  run:
    help: "Run the server (config from ~/.config/riki/riki.yml)"
    bash: |
      cargo run -p riki-server

  clean:
    help: "Clean build artifacts"
    bash: |
      cargo clean
      echo "=== Build artifacts cleaned ==="
