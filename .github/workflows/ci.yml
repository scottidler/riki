name: CI

# Thin caller: delegates Rust CI (otto ci) to the org's reusable workflow.
# Source: tatari-tv/github-actions-public/.github/workflows/rust-ci.yml (pinned to v1).
# Change the pipeline by editing the reusable workflow, not this file.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: tatari-tv/github-actions-public/.github/workflows/rust-ci.yml@v2.4.2
    with:
      rust-version: "1.99.1"
